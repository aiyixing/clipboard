[package]
name = "clipboard-monitor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-win = "5"
arboard = "3"
clipboard-rs = "0.3.3"
screenshots = "0.8"
image = "0.25"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
regex = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
lazy_static = "1.4"
open = "5.0"
